name: Bug Report
description: Report a reproducible bug with Global Reach or its documentation website.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        > **Security Warning:** Do **NOT** include Discord tokens, configuration secrets, `Authorization` headers, cookies, or personal Discord User/Server IDs in this issue.
  - type: textarea
    id: summary
    attributes:
      label: Bug Summary
      description: A clear and concise description of what went wrong.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Exact steps to reproduce the behavior.
      placeholder: |
        1. Invite bot / open page '...'
        2. Perform action or click '...'
        3. Observe error '...'
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Affected Area
      options:
        - Discord Bot Interaction / Permissions
        - Documentation / Website
        - Terms / Privacy Policy
        - Other
    validations:
      required: true
  - type: checkboxes
    id: secret-check
    attributes:
      label: Security Confirmation
      options:
        - label: I confirm that I have removed all Discord tokens, secrets, and personal Discord identifiers from this report.
          required: true
